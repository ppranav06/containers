services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: tailscale-n8n
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # for certificates from tailscale
      - TS_EXTRA_ARGS=--cert=tailscale-n8n
    volumes:
      - ts_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun # Required for Tailscale networking
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-app
    restart: unless-stopped
    # Route all incoming/outgoing traffic through the tailscale container
    network_mode: "service:tailscale" 
    depends_on:
      - tailscale
    environment:
      # - N8N_HOST=n8n-home
      # - N8N_PORT=5678
      # - N8N_WEBHOOK_URL=http://n8n-home:5678/ # Update this if using Tailscale MagicDNS HTTPS later
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true

      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https  
      - NODE_ENV=production
      - N8N_WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

volumes:
  n8n_data:
  ts_state:
