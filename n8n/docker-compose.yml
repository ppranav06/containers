services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: tailscale-n8n

    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve.json

    volumes:
      - ts_state:/var/lib/tailscale
      - ./tailscale:/config:ro
      - /dev/net/tun:/dev/net/tun

    cap_add:
      - NET_ADMIN
      - NET_RAW

    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-app
    restart: unless-stopped

    network_mode: service:tailscale

    depends_on:
      - tailscale

    environment:
      - N8N_HOST=${TAILSCALE_FQDN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https

      # - N8N_EDITOR_BASE_URL=https://${TAILSCALE_FQDN}/
      # - N8N_WEBHOOK_URL=https://${TAILSCALE_FQDN}/
      - N8N_EDITOR_BASE_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - N8N_WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - N8N_PROXY_HOPS=1

      - NODE_ENV=production
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true

      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}

      - N8N_RESTRICT_FILE_ACCESS_TO=/files

    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

volumes:
  n8n_data:
  ts_state:

